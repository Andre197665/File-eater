name: Build Voce di Classe APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/VoceDiClasseAndroid-Appunti.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Extract Android project
        run: |
          ZIP_FILE=".github/workflows/VoceDiClasseAndroid-Appunti.zip"
          test -f "$ZIP_FILE" || (echo "ZIP file not found at $ZIP_FILE" && exit 1)
          mkdir source
          unzip -q "$ZIP_FILE" -d source
          SETTINGS_FILE="$(find source -name settings.gradle -o -name settings.gradle.kts | head -n 1)"
          test -n "$SETTINGS_FILE" || (echo "Could not find settings.gradle in the ZIP." && exit 1)
          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
      - name: Fix Java back navigation compile error
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("source/VoceDiClasseAndroid/app/src/main/java/it/vocediclasse/app/MainActivity.java")
          s = p.read_text()
          old = """    @Override public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) webView.goBack();
                  else if (webView != null && webView.evaluateJavascript("window.goBack && window.goBack()", null) == null) super.onBackPressed();
                  else super.onBackPressed();
              }"""
          new = """    @Override public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else if (webView != null) {
                      webView.evaluateJavascript("if (window.goBack) window.goBack(); else history.back();", null);
                  } else {
                      super.onBackPressed();
                  }
              }"""
          if old not in s:
              raise SystemExit("Expected onBackPressed method not found; stopping safely.")
          p.write_text(s.replace(old, new))
          print("Patched onBackPressed method")
          PY
      - name: Give this build a separate app identity
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          root = Path("source")
          candidates = list(root.glob("**/app/build.gradle")) + list(root.glob("**/app/build.gradle.kts"))
          if not candidates:
              raise SystemExit("Could not find app Gradle file")
          for p in candidates:
              s = p.read_text()
              pattern = r'(applicationId\s*(?:=\s*)?["\'])([A-Za-z][A-Za-z0-9_.]*)(["\'])'
              m = re.search(pattern, s)
              if m:
                  old_id = m.group(2)
                  new_id = old_id if old_id.endswith(".nuova") else old_id + ".nuova"
                  p.write_text(s[:m.start(2)] + new_id + s[m.end(2):])
                  print(f"Application ID changed: {old_id} -> {new_id}")
                  break
          else:
              for p in candidates:
                  print("Gradle file inspected:", p)
                  print(p.read_text()[:5000])
              raise SystemExit("Could not safely locate applicationId")
          for p in root.glob("**/app/src/main/res/values/strings.xml"):
              s = p.read_text()
              updated, n = re.subn(r'(<string\s+name=["\']app_name["\']\s*>).*?(</string>)',
                                   r'\1Voce di Classe Nuova\2', s, count=1, flags=re.S)
              if n:
                  p.write_text(updated)
                  print("App display name changed to Voce di Classe Nuova")
                  break
          PY
      - name: Improve bottom navigation on phones
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('source/VoceDiClasseAndroid/app/src/main/assets/index.html')
          s = p.read_text()
          pattern = r'nav\{[^}]*\}\s*nav button\{[^}]*\}nav \.on\{[^}]*\}'
          new = 'nav{position:fixed;bottom:0;left:0;right:0;background:var(--g);border-top:1px solid var(--l);display:flex;overflow-x:auto;overscroll-behavior-x:contain;padding:4px 4px calc(4px + env(safe-area-inset-bottom));gap:2px}\\nnav button{flex:0 0 auto;min-width:56px;border:0;background:none;font-size:11px;line-height:1.2;color:var(--m);padding:8px 7px;white-space:nowrap}nav .on{color:var(--ink);font-weight:700;background:var(--hp);border-radius:var(--r)}'
          s, count = re.subn(pattern, lambda m: new, s, count=1)
          if count != 1: raise SystemExit('Could not safely locate navigation CSS')
          p.write_text(s)
          print('Navigation now scrolls horizontally and uses smaller text')
          PY
      - name: Add image attachments to class notes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('source/VoceDiClasseAndroid/app/src/main/assets/index.html')
          s = p.read_text()
          old = "const newNote=()=>form('Condividi appunti',[['subject','Materia','text','required'],['t','Titolo','text','required'],['topic','Cosa spiegano?','text','required'],['body','Appunti (puoi incollare il testo)','area','required']],v=>{S.notes=S.notes||[];S.notes.push({id:id(),subject:v.subject,t:v.t,topic:v.topic,body:v.body,by:S.me,d:today()});notifyClass('Nuovi appunti','È stato condiviso un nuovo appunto dalla classe')},'Condividi');"
          new = """const newNote=()=>{
          const o=document.createElement('div');o.className='ov';
          o.innerHTML='<form><h2>Condividi appunti</h2><label>Materia</label><input name=\"subject\" required><label>Titolo</label><input name=\"t\" required><label>Cosa spiegano?</label><input name=\"topic\" required><label>Appunti (puoi incollare il testo)</label><textarea name=\"body\" rows=\"3\" placeholder=\"Scrivi o incolla gli appunti\"></textarea><label>Aggiungi una foto o immagine (PNG, JPG ecc.)</label><input name=\"image\" type=\"file\" accept=\"image/*\"><img id=\"notePreview\" alt=\"Anteprima\" style=\"display:none;max-width:100%;max-height:180px;object-fit:contain;margin:4px 0 10px\"><div class=\"row\"><button type=\"button\" class=\"sp\" id=\"cx\">Annulla</button><button class=\"sp p\">Condividi</button></div></form>';
          document.body.append(o);const f=o.querySelector('form'),file=f.elements.image,preview=o.querySelector('#notePreview');
          file.onchange=()=>{const selected=file.files&&file.files[0];if(!selected){preview.style.display='none';return}if(!selected.type.startsWith('image/')){alert('Scegli un file immagine PNG o JPG.');file.value='';return}preview.src=URL.createObjectURL(selected);preview.style.display='block'};
          o.querySelector('#cx').onclick=()=>o.remove();
          f.onsubmit=async e=>{e.preventDefault();const subject=f.elements.subject.value.trim(),t=f.elements.t.value.trim(),topic=f.elements.topic.value.trim(),body=f.elements.body.value.trim(),selected=file.files&&file.files[0];if(!subject||!t||!topic){alert('Compila materia, titolo e argomento.');return}if(!body&&!selected){alert('Scrivi gli appunti o scegli un’immagine.');return}
          const button=f.querySelector('.p');button.disabled=true;button.textContent='Preparo…';
          try{let image='';if(selected){image=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onerror=()=>reject(new Error('Impossibile leggere l’immagine'));reader.onload=()=>{const img=new Image();img.onerror=()=>reject(new Error('Immagine non valida'));img.onload=()=>{const max=1000,scale=Math.min(1,max/Math.max(img.width,img.height)),canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.width*scale));canvas.height=Math.max(1,Math.round(img.height*scale));canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);resolve(canvas.toDataURL('image/jpeg',0.65))};img.src=reader.result};reader.readAsDataURL(selected)})}
          S.notes=S.notes||[];S.notes.push({id:id(),subject,t,topic,body,image,by:S.me,d:today()});notifyClass('Nuovi appunti','È stato condiviso un nuovo appunto dalla classe');o.remove();save();draw()
          }catch(err){alert(err.message||'Errore nel preparare l’immagine');button.disabled=false;button.textContent='Condividi'}
          };
          };"""
          if old not in s: raise SystemExit('newNote function not found')
          s=s.replace(old,new,1)
          old_render = 'E(n.body)}</p><div class=\"row m\" style=\"margin-top:10px\">'
          new_render = 'E(n.body||\'\')}</p>${n.image ? \'<img src=\"\'+E(n.image)+\'\" alt=\"Immagine degli appunti\" loading=\"lazy\" style=\"display:block;max-width:100%;max-height:520px;object-fit:contain;margin-top:10px;border-radius:6px\">\' : \'\'}<div class=\"row m\" style=\"margin-top:10px\">'
          if old_render not in s: raise SystemExit('notes display template not found')
          s=s.replace(old_render,new_render,1)
          p.write_text(s)
          print('Image attachments enabled for class notes')
          PY
      - name: Build debug APK
        run: gradle -p "$PROJECT_DIR" assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: voce-di-classe-nuova-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

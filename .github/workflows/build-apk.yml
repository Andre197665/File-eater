name: Build Voce di Classe APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/VoceDiClasseAndroid-Appunti.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Extract Android project
        run: |
          ZIP_FILE=".github/workflows/VoceDiClasseAndroid-Appunti.zip"
          test -f "$ZIP_FILE" || (echo "ZIP file not found at $ZIP_FILE" && exit 1)
          mkdir source
          unzip -q "$ZIP_FILE" -d source
          SETTINGS_FILE="$(find source -name settings.gradle -o -name settings.gradle.kts | head -n 1)"
          test -n "$SETTINGS_FILE" || (echo "Could not find settings.gradle in the ZIP." && exit 1)
          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
      - name: Fix Java back navigation compile error
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("source/VoceDiClasseAndroid/app/src/main/java/it/vocediclasse/app/MainActivity.java")
          s = p.read_text()
          old = """    @Override public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) webView.goBack();
                  else if (webView != null && webView.evaluateJavascript("window.goBack && window.goBack()", null) == null) super.onBackPressed();
                  else super.onBackPressed();
              }"""
          new = """    @Override public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else if (webView != null) {
                      webView.evaluateJavascript("if (window.goBack) window.goBack(); else history.back();", null);
                  } else {
                      super.onBackPressed();
                  }
              }"""
          if old not in s:
              raise SystemExit("Expected onBackPressed method not found; stopping safely.")
          p.write_text(s.replace(old, new))
          print("Patched onBackPressed method")
          PY
      - name: Give this build a separate app identity
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          root = Path("source")
          candidates = list(root.glob("**/app/build.gradle")) + list(root.glob("**/app/build.gradle.kts"))
          if not candidates:
              raise SystemExit("Could not find app Gradle file")
          for p in candidates:
              s = p.read_text()
              pattern = r'(applicationId\s*(?:=\s*)?["\'])([A-Za-z][A-Za-z0-9_.]*)(["\'])'
              m = re.search(pattern, s)
              if m:
                  old_id = m.group(2)
                  new_id = old_id if old_id.endswith(".nuova") else old_id + ".nuova"
                  p.write_text(s[:m.start(2)] + new_id + s[m.end(2):])
                  print(f"Application ID changed: {old_id} -> {new_id}")
                  break
          else:
              for p in candidates:
                  print("Gradle file inspected:", p)
                  print(p.read_text()[:5000])
              raise SystemExit("Could not safely locate applicationId")
          for p in root.glob("**/app/src/main/res/values/strings.xml"):
              s = p.read_text()
              updated, n = re.subn(r'(<string\s+name=["\']app_name["\']\s*>).*?(</string>)',
                                   r'\1Voce di Classe Nuova\2', s, count=1, flags=re.S)
              if n:
                  p.write_text(updated)
                  print("App display name changed to Voce di Classe Nuova")
                  break
          PY
      - name: Build debug APK
        run: gradle -p "$PROJECT_DIR" assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: voce-di-classe-nuova-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
